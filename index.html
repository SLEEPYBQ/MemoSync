<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        let resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        try {
          const cached = localStorage.getItem("memosync:resolved-theme")
          if (cached === "light" || cached === "dark") resolved = cached
        } catch {}
        document.documentElement.classList.toggle("dark", resolved === "dark")
        document.documentElement.style.colorScheme = resolved
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", resolved === "dark" ? "rgb(33, 32, 31)" : "rgb(255, 255, 255)")
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.setAttribute("content", resolved === "dark" ? "black-translucent" : "default")
      })()
    </script>
    <!-- Brand is condition-aware (study arms must not show the MemoSync
         identity): the empty title and the favicon are filled in by
         BrandMark once /api/condition resolves. -->
    <title></title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
