# Checks that the project website in site/ builds. The site is served at
# https://baiqiaozhang.cc/memosync/; that server pulls main and rebuilds on its own.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "src/client/components/brand/brand-svgs.ts", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "src/client/components/brand/brand-svgs.ts", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: site
        run: bun run build
