name: Native draft upload receipts

on:
  pull_request:
    paths:
      - "src/server/uploads.ts"
      - "src/server/paths.ts"
      - "src/server/draft-upload-receipts.test.ts"
      - ".github/workflows/draft-upload-receipts.yml"
  push:
    branches: [main]
    paths:
      - "src/server/uploads.ts"
      - "src/server/paths.ts"
      - "src/server/draft-upload-receipts.test.ts"
      - ".github/workflows/draft-upload-receipts.yml"

permissions:
  contents: read

concurrency:
  group: draft-upload-receipts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test src/server/draft-upload-receipts.test.ts --timeout 30000
