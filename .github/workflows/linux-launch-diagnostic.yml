# Temporary compatibility verification against the supported native binary.
name: Linux launch diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/linux-launch-diagnostic.yml

permissions:
  contents: read

jobs:
  native-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Install pinned native OpenCode outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode-compat" --no-audit --no-fund opencode-ai@1.19.5
          "$RUNNER_TEMP/opencode-compat/node_modules/.bin/opencode" --version
      - name: Run native backend against the scripted local model
        run: |
          mkdir -p artifacts
          export MEMOSYNC_OPENCODE_TEST_BIN="$RUNNER_TEMP/opencode-compat/node_modules/.bin/opencode"
          bun test ./src/server/opencode-agent.integration.test.ts --timeout 30000 \
            --reporter=junit --reporter-outfile=artifacts/opencode-native.xml \
            2>&1 | tee artifacts/opencode-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-native-compatibility
          path: artifacts/
