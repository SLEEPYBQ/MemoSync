# Temporary controlled comparison for the Linux spawn failure. Remove after diagnosis.
name: Linux launch diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/linux-launch-diagnostic.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision:
          - baseline
          - pr82
        suite:
          - isolated
          - full
        include:
          - revision: baseline
            ref: 6a9e6ab1265debbf9213345a9efaee14977817a9
          - revision: pr82
            ref: c71de03210126947fa55813481832742cfd6835b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Match CI setup
        run: |
          git config --global init.defaultBranch main
          git config --global user.name ci
          git config --global user.email ci@example.com
          git rev-parse HEAD
          bun --version
          uname -sm
      - run: bun run check
      - name: Apply identical observation-only instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/server/opencode-server.ts")
          source = path.read_text()
          anchor = "  const child = spawn(launcher.command,"
          assert source.count(anchor) == 1
          source = "import { existsSync, fstatSync } from 'node:fs'\n" + source
          before = """
            const diagnosticStarted = performance.now()
            const diagnosticName = (value: string) => value.split(/[\\\\/]/).at(-1)
            const diagnosticFds = () => [0, 1, 2].map(fd => {
              try {
                const stat = fstatSync(fd)
                return { fd, open: true, type: stat.mode & 0o170000 }
              } catch (error) {
                return { fd, open: false, code: (error as NodeJS.ErrnoException).code }
              }
            })
            let diagnosticSpawned = false
            let diagnosticOut = 0
            let diagnosticErr = 0
            const diagnostic = (phase: string, extra: Record<string, unknown> = {}) =>
              console.error('[launch-diagnostic]', JSON.stringify({
                phase, elapsedMs: Math.round(performance.now() - diagnosticStarted),
                command: diagnosticName(launcher.command),
                commandIsCurrentRuntime: launcher.command === process.execPath,
                input: diagnosticName(args.executable),
                cwdExists: existsSync(args.cwd),
                spawned: diagnosticSpawned, stdoutBytes: diagnosticOut, stderrBytes: diagnosticErr,
                stdio: diagnosticFds(), ...extra,
              }))
            diagnostic('before-spawn')
          """
          source = source.replace(anchor, before + "\n" + anchor)
          anchor = "  let closing: Promise<void> | undefined"
          assert source.count(anchor) == 1
          after = """
            child.once('spawn', () => {
              diagnosticSpawned = true
              diagnostic('spawn', { pid: child.pid })
            })
            child.on('error', (error: NodeJS.ErrnoException) =>
              diagnostic('error', { pid: child.pid, code: error.code }))
            child.once('exit', (code, signal) => diagnostic('exit', { pid: child.pid, code, signal }))
            child.stdout?.on('data', chunk => { diagnosticOut += chunk.length })
            child.stderr?.on('data', chunk => { diagnosticErr += chunk.length })
          """
          source = source.replace(anchor, after + "\n" + anchor)
          path.write_text(source)
          fixture = Path("src/server/fixtures/opencode-server-fixture.ts")
          source = fixture.read_text()
          anchor = "const server = Bun.serve("
          assert source.count(anchor) == 1
          source = source.replace(anchor, "console.error('[fixture-diagnostic] entered HTTP fixture')\n" + anchor)
          fixture.write_text(source)
          PY
      - name: Run unchanged assertions once
        env:
          DIAGNOSTIC_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p artifacts
          if [ "$DIAGNOSTIC_SUITE" = isolated ]; then
            set -- ./src/server/opencode-agent.test.ts
          else
            set -- src/ scripts/analyze-experiment.test.ts
          fi
          bun test "$@" --timeout 30000 --reporter=junit --reporter-outfile=artifacts/tests.xml 2>&1 | tee artifacts/launch-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-${{ matrix.revision }}-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: warn
