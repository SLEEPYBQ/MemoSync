# Temporary runtime ownership reproduction, independent of MemoSync and OpenCode.
name: Linux launch diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/linux-launch-diagnostic.yml

permissions:
  contents: read

jobs:
  descriptor-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
        stdio: [standard, extra]
    defaults:
      run:
        shell: bash
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Write self-contained ownership check
        run: |
          mkdir -p artifacts
          cat > artifacts/descriptor-ownership.mjs <<'JS'
          import assert from 'node:assert/strict'
          import { spawn } from 'node:child_process'
          import { openSync, fstatSync, closeSync } from 'node:fs'
          import { setTimeout as delay } from 'node:timers/promises'

          const mode = process.argv[2]
          assert.ok(mode === 'standard' || mode === 'extra')
          async function spawnAndClose() {
            const child = spawn('/bin/true', [], {
              stdio: mode === 'extra'
                ? ['ignore', 'pipe', 'pipe', 'pipe', 'pipe']
                : ['ignore', 'pipe', 'pipe'],
            })
            for (const stream of child.stdio) stream?.resume()
            const code = await new Promise((resolve, reject) => {
              child.once('error', reject)
              child.once('close', resolve)
            })
            assert.equal(code, 0)
          }
          await spawnAndClose()
          // These descriptors belong to this caller, not to the finished child.
          const owned = Array.from({ length: 8 }, () => openSync('/dev/null', 'r'))
          const collect = globalThis.Bun
            ? () => Bun.gc(true)
            : () => global.gc()
          collect()
          await delay(20)
          collect()
          await delay(20)
          const closed = []
          for (const fd of owned) {
            try { fstatSync(fd) }
            catch (error) { closed.push({ fd, code: error.code }) }
          }
          console.log(JSON.stringify({
            runtime: process.versions.bun ? `Bun ${process.versions.bun}` : `Node ${process.versions.node}`,
            mode, owned, unexpectedlyClosed: closed,
          }))
          for (const fd of owned) {
            try { closeSync(fd) } catch {}
          }
          assert.deepEqual(closed, [], 'GC of a completed child must not close caller-owned descriptors')
          JS
      - name: Execute one controlled case
        env:
          DIAGNOSTIC_RUNTIME: ${{ matrix.runtime }}
          DIAGNOSTIC_STDIO: ${{ matrix.stdio }}
        run: |
          if [ "$DIAGNOSTIC_RUNTIME" = bun ]; then
            bun artifacts/descriptor-ownership.mjs "$DIAGNOSTIC_STDIO" 2>&1 | tee artifacts/result.log
          else
            node --expose-gc artifacts/descriptor-ownership.mjs "$DIAGNOSTIC_STDIO" 2>&1 | tee artifacts/result.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-${{ matrix.runtime }}-${{ matrix.stdio }}
          path: artifacts/
