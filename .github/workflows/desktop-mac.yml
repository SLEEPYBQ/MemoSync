name: Desktop release

on:
  # Full native packaging is a release check, not a required PR check.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after every native package and smoke test passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            architecture: arm64
          - runner: macos-15-intel
            platform: darwin
            architecture: x64
          - runner: windows-2025
            platform: win32
            architecture: x64
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MEMOSYNC_TARGET_PLATFORM: ${{ matrix.platform }}
      MEMOSYNC_TARGET_ARCH: ${{ matrix.architecture }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        run: bun install --cwd desktop --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Probe real native CLI host actions with a loopback provider
        run: bun run desktop/native-probes.ts
      - name: Package native desktop
        run: bun run desktop:package
      - name: Test desktop host policies and lifecycle
        run: node --test desktop/policy.test.cjs
      - name: Test staged desktop backend
        run: bun test desktop/runtime.test.ts --timeout 30000
      - name: Configure Linux smoke display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          # Allow Electron's sandboxed user namespace on this disposable runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Exercise packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node desktop/packaged-smoke.cjs
      - name: Exercise packaged app (macOS and Windows)
        if: runner.os != 'Linux'
        run: node desktop/packaged-smoke.cjs
      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: MemoSync-desktop-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*-Setup.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemoSync-smoke-${{ matrix.platform }}-${{ matrix.architecture }}
          path: desktop/release/smoke/
          if-no-files-found: ignore

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MemoSync-desktop-*
          merge-multiple: true
          path: release-assets
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify all targets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run desktop/publish-release.ts
