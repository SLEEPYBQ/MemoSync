name: macOS desktop

on:
  # Releases can always request both native architectures from merged main.
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MEMOSYNC_TARGET_ARCH: ${{ matrix.architecture }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        run: bun install --cwd desktop --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Package
        run: bun run desktop:package:mac
      - name: Test desktop host policies and lifecycle
        run: node --test desktop/policy.test.cjs
      - name: Test staged desktop backend
        run: bun test desktop/runtime.test.ts --timeout 30000
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MemoSync-macOS-${{ matrix.architecture }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
