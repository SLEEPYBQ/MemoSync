# CI: typecheck, client builds, offline regressions, and installed-package smoke.
# No LLM calls: model passes are stub-injected; network fixtures use loopback.
# Dependency installation uses the registry. The live-model test
# (title-generation.live.test.ts) is gated behind
# KANNA_RUN_LIVE_TITLE_TESTS=1. E2E scripts (scripts/e2e-*.ts) are NOT run
# here — they need a live instance + a real DeepSeek key.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium for integration tests
        run: bunx playwright install --with-deps chromium
      - name: Configure git for tests
        # The pre-existing Kanna git tests (diff-store etc.) create temp repos
        # and assume the default branch is `main` — set it like a dev machine.
        run: |
          git config --global init.defaultBranch main
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Typecheck + client builds
        run: bun run check
      - name: Unit + integration tests
        # Bound integration fixtures without retries. The existing real-shell
        # terminal cases currently skip under CI; this timeout does not run them.
        run: |
          mkdir -p artifacts
          bun test src/ scripts/analyze-experiment.test.ts --timeout 30000 --reporter=junit --reporter-outfile=artifacts/tests.xml
      - name: Installed package smoke
        env:
          MEMOSYNC_SMOKE_PRIVILEGED_NETNS: "1"
        run: bun test scripts/package-smoke.test.ts --timeout 30000
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            artifacts/tests.xml
            artifacts/package-smoke.log
          if-no-files-found: warn
